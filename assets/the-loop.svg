<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="460" rx="16" fill="#0f0f23"/>

  <text x="460" y="46" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="4">THE AUTORESEARCH LOOP</text>
  <text x="460" y="70" text-anchor="middle" fill="#888888" font-size="13">one experiment at a time &#183; mechanical scoring &#183; keep only what measures better</text>

  <!-- cycle track -->
  <path id="cycle" d="M 230 150 H 690 Q 780 150 780 235 V 245 Q 780 330 690 330 H 230 Q 140 330 140 245 V 235 Q 140 150 230 150 Z"
        fill="none" stroke="#2a2a5e" stroke-width="2"/>

  <!-- direction hints -->
  <path d="M 355 144 l 12 6 l -12 6 z" fill="#3b3b7a"/>
  <path d="M 575 144 l 12 6 l -12 6 z" fill="#3b3b7a"/>
  <path d="M 470 336 l -12 -6 l 12 -6 z" fill="#3b3b7a"/>
  <path d="M 152 200 l 0 14 l -10 -7 z" fill="#3b3b7a" transform="rotate(180 147 207)"/>
  <path d="M 774 214 l 12 7 l -12 7 z" fill="#3b3b7a" transform="rotate(90 780 221)"/>

  <!-- the single travelling experiment -->
  <circle r="7" fill="#60a5fa" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="none">
      <mpath href="#cycle"/>
    </animateMotion>
  </circle>

  <!-- 1 REVIEW (t ~ 0.013) -->
  <g>
    <rect x="180" y="124" width="140" height="52" rx="10" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1.5">
      <animate attributeName="stroke" values="#2a2a5e;#2a2a5e;#60a5fa;#2a2a5e;#2a2a5e" keyTimes="0;0.0;0.015;0.08;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="250" y="146" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">1 &#183; REVIEW</text>
    <text x="250" y="164" text-anchor="middle" fill="#888888" font-size="11">read log + target state</text>
  </g>

  <!-- 2 MODIFY (t ~ 0.151) -->
  <g>
    <rect x="390" y="124" width="140" height="52" rx="10" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1.5">
      <animate attributeName="stroke" values="#2a2a5e;#2a2a5e;#60a5fa;#2a2a5e;#2a2a5e" keyTimes="0;0.10;0.155;0.22;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="460" y="146" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">2 &#183; MODIFY</text>
    <text x="460" y="164" text-anchor="middle" fill="#888888" font-size="11">one focused change</text>
  </g>

  <!-- 3 VERIFY (t ~ 0.288) -->
  <g>
    <rect x="600" y="124" width="140" height="52" rx="10" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1.5">
      <animate attributeName="stroke" values="#2a2a5e;#2a2a5e;#60a5fa;#2a2a5e;#2a2a5e" keyTimes="0;0.24;0.29;0.36;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="670" y="146" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">3 &#183; VERIFY</text>
    <text x="670" y="164" text-anchor="middle" fill="#888888" font-size="11">test prompts + guard</text>
  </g>

  <!-- 4 DECIDE (t ~ 0.553) -->
  <g>
    <rect x="540" y="304" width="140" height="52" rx="10" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1.5">
      <animate attributeName="stroke" values="#2a2a5e;#2a2a5e;#60a5fa;#2a2a5e;#2a2a5e" keyTimes="0;0.50;0.555;0.63;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="610" y="326" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">4 &#183; DECIDE</text>
    <text x="610" y="344" text-anchor="middle" fill="#888888" font-size="11">score vs. best so far</text>

    <!-- alternating verdict chips: keep on odd laps, revert on even laps (18s = 2 laps) -->
    <g>
      <rect x="548" y="366" width="58" height="24" rx="12" fill="#064e3b"/>
      <text x="577" y="382" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">&#10003; KEEP</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.26;0.29;0.49;0.52;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="614" y="366" width="68" height="24" rx="12" fill="#4a1d1d"/>
      <text x="648" y="382" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">&#10007; REVERT</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.76;0.79;0.99;0.995;1" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 5 LOG (t ~ 0.749) -->
  <g>
    <rect x="240" y="304" width="140" height="52" rx="10" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1.5">
      <animate attributeName="stroke" values="#2a2a5e;#2a2a5e;#60a5fa;#2a2a5e;#2a2a5e" keyTimes="0;0.70;0.75;0.82;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="310" y="326" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">5 &#183; LOG</text>
    <text x="310" y="344" text-anchor="middle" fill="#888888" font-size="11">append results.tsv</text>
  </g>

  <!-- centre: experiment counter -->
  <g text-anchor="middle">
    <text x="460" y="232" fill="#888888" font-size="12" letter-spacing="2">EXPERIMENT</text>
    <g fill="#60a5fa" font-size="34" font-weight="700">
      <text x="460" y="270">041<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.32;0.34;0.34;0.99;0.995;1" dur="27s" repeatCount="indefinite"/></text>
      <text x="460" y="270" opacity="0">042<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.655;0.675;1" dur="27s" repeatCount="indefinite"/></text>
      <text x="460" y="270" opacity="0">043<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.665;0.685;0.985;1" dur="27s" repeatCount="indefinite"/></text>
    </g>
    <text x="460" y="294" fill="#888888" font-size="11">auto-revert on failure &#183; the human may be asleep</text>
  </g>

  <text x="460" y="436" text-anchor="middle" fill="#56567e" font-size="11">runs until interrupted, or for a bounded number of experiments</text>
</svg>
