<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 404" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="920" height="404" rx="16" fill="#0f0f23"/>

  <text x="40" y="40" fill="#ffffff" font-size="17" font-weight="700">score progression</text>
  <text x="40" y="60" fill="#888888" font-size="12">every experiment is logged &#8212; keeps raise the bar, discards and crashes revert</text>

  <!-- legend -->
  <g font-size="11">
    <line x1="610" y1="36" x2="640" y2="36" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="646" y="40" fill="#a8a8c8">score</text>
    <line x1="694" y1="36" x2="724" y2="36" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="730" y="40" fill="#a8a8c8">best</text>
    <circle cx="772" cy="36" r="4.5" fill="#4ade80"/>
    <text x="781" y="40" fill="#a8a8c8">keep</text>
    <circle cx="820" cy="36" r="4.5" fill="#f87171"/>
    <text x="829" y="40" fill="#a8a8c8">discard</text>
    <circle cx="878" cy="36" r="4.5" fill="#facc15"/>
    <text x="887" y="40" fill="#a8a8c8">crash</text>
  </g>

  <g transform="translate(0,24)">
  <!-- gridlines + y labels (score out of 48) -->
  <g stroke="#1f1f4f" stroke-width="1">
    <line x1="90" y1="320" x2="890" y2="320"/>
    <line x1="90" y1="255" x2="890" y2="255"/>
    <line x1="90" y1="190" x2="890" y2="190"/>
    <line x1="90" y1="125" x2="890" y2="125"/>
    <line x1="90" y1="60" x2="890" y2="60"/>
  </g>
  <g fill="#888888" font-size="11" text-anchor="end">
    <text x="80" y="324">0</text>
    <text x="80" y="259">12</text>
    <text x="80" y="194">24</text>
    <text x="80" y="129">36</text>
    <text x="80" y="64">48</text>
  </g>

  <!-- axes -->
  <g stroke="#2a2a5e" stroke-width="1.5">
    <line x1="90" y1="56" x2="90" y2="320"/>
    <line x1="90" y1="320" x2="890" y2="320"/>
  </g>

  <!-- running best (green dashed), draws after the score line starts -->
  <polyline points="110,168 195,130 280,130 365,120 450,120 535,103 620,103 705,93 790,93 875,76"
            fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,4" opacity="0.9">
    <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.56;0.62;1" dur="10s" repeatCount="indefinite"/>
  </polyline>

  <!-- raw score line, drawing itself -->
  <polyline points="110,168 195,130 280,141 365,120 450,136 535,103 620,320 705,93 790,98 875,76"
            fill="none" stroke="#60a5fa" stroke-width="2.5"
            stroke-dasharray="1150" stroke-dashoffset="1150">
    <animate attributeName="stroke-dashoffset" values="1150;0;0" keyTimes="0;0.55;1" dur="10s" repeatCount="indefinite"/>
  </polyline>

  <!-- experiment dots, appearing as the line reaches them -->
  <circle cx="110" cy="168" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.01;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="195" cy="130" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.061;0.075;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="280" cy="141" r="5" fill="#f87171"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.122;0.136;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="365" cy="120" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.183;0.197;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="136" r="5" fill="#f87171"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.244;0.258;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="535" cy="103" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.306;0.32;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="320" r="5" fill="#facc15"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.367;0.381;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="705" cy="93" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.428;0.442;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="98" r="5" fill="#f87171"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.489;0.503;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="875" cy="76" r="5" fill="#4ade80"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.564;1" dur="10s" repeatCount="indefinite"/></circle>

  <!-- x labels -->
  <g fill="#888888" font-size="10" text-anchor="middle">
    <text x="110" y="340">001</text>
    <text x="195" y="340">002</text>
    <text x="280" y="340">003</text>
    <text x="365" y="340">004</text>
    <text x="450" y="340">005</text>
    <text x="535" y="340">006</text>
    <text x="620" y="340">007</text>
    <text x="705" y="340">008</text>
    <text x="790" y="340">009</text>
    <text x="875" y="340">010</text>
  </g>
  <text x="490" y="364" text-anchor="middle" fill="#56567e" font-size="11">experiment &#8212; baseline first, then one change at a time (crash on 007 scored 0 and was reverted)</text>
  </g>
</svg>
