<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="920" height="420" rx="16" fill="#0f0f23"/>
  <text x="460" y="36" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="1">NO-HEADLESS AUTORESEARCH (v2+)</text>

  <!-- You provide -->
  <text x="140" y="70" text-anchor="middle" fill="#888888" font-size="11" letter-spacing="2">YOU PROVIDE</text>
  <rect x="40" y="82" width="200" height="48" rx="10" fill="#1a1a3e" stroke="#2a2a5e"/>
  <text x="140" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">target file(s) + metric</text>
  <rect x="40" y="142" width="200" height="48" rx="10" fill="#1a1a3e" stroke="#2a2a5e"/>
  <text x="140" y="170" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">verify / guard commands</text>
  <rect x="40" y="202" width="200" height="48" rx="10" fill="#1a1a3e" stroke="#2a2a5e"/>
  <text x="140" y="230" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">optional private verify</text>

  <!-- Active harness -->
  <rect x="300" y="82" width="320" height="200" rx="12" fill="#161636" stroke="#6366f1" stroke-width="1.5"/>
  <text x="460" y="112" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Active harness session</text>
  <text x="460" y="132" text-anchor="middle" fill="#a5b4fc" font-size="11">Claude Code · Codex · Gemini · Pi · Hermes</text>
  <text x="460" y="168" text-anchor="middle" fill="#c4c4e0" font-size="12">reads state · makes ONE change</text>
  <text x="460" y="192" text-anchor="middle" fill="#c4c4e0" font-size="12">runs helper score · never shells a second model</text>
  <text x="460" y="216" text-anchor="middle" fill="#c4c4e0" font-size="12">optional in-session binary judgments</text>
  <text x="460" y="250" text-anchor="middle" fill="#888888" font-size="11">the agent runtime is this session</text>

  <!-- Helpers -->
  <text x="780" y="70" text-anchor="middle" fill="#888888" font-size="11" letter-spacing="2">DETERMINISTIC HELPERS</text>
  <rect x="680" y="82" width="200" height="44" rx="10" fill="#0f2a1f" stroke="#166534"/>
  <text x="780" y="108" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">autoresearch_loop.py</text>
  <rect x="680" y="136" width="200" height="44" rx="10" fill="#0f2a1f" stroke="#166534"/>
  <text x="780" y="162" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">eval_engine.py</text>
  <rect x="680" y="190" width="200" height="44" rx="10" fill="#0f2a1f" stroke="#166534"/>
  <text x="780" y="216" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">generate_dashboard.py</text>
  <text x="780" y="255" text-anchor="middle" fill="#888888" font-size="10">verify · snapshot · keep/discard · score</text>

  <!-- Flow -->
  <text x="460" y="320" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">baseline → one change → score → KEEP / DISCARD / CRASH → log → repeat</text>
  <text x="460" y="348" text-anchor="middle" fill="#888888" font-size="11">budgets · parent lineage · multi-target snapshots · sealed config · named metrics</text>
  <text x="460" y="380" text-anchor="middle" fill="#666680" font-size="11">No headless model backends. No claude -p / print modes for the loop.</text>
</svg>
