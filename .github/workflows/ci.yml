name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        # bash so globs expand on Windows runners (cmd does not expand *.py)
        shell: bash
        run: |
          python -m py_compile scripts/*.py tests/*.py
      - run: python -m pytest tests/ -v
      - name: CLI help smoke checks
        shell: bash
        run: |
          python scripts/autoresearch_loop.py --help
          python scripts/eval_engine.py --help
          python scripts/generate_dashboard.py --help
          python scripts/autoresearch_loop.py score --help | grep -q allow-config-change
          python scripts/autoresearch_loop.py status --help | grep -q json
